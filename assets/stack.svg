      <text x="632" y="116" fill="#F0C14D" font-size="12" font-weight="700" letter-spacing="1.4">03</text>
      <text x="742" y="168" text-anchor="middle" fill="#F4F7FB" font-size="20" font-weight="700">Back-end</text>
      <text x="742" y="220" text-anchor="middle" fill="#B7C3D6" font-size="13">Python · Firebase</text>
      <text x="742" y="242" text-anchor="middle" fill="#B7C3D6" font-size="13">APIs REST</text>
      <text x="742" y="264" text-anchor="middle" fill="#B7C3D6" font-size="13">Notions Node.js · FastAPI</text>
