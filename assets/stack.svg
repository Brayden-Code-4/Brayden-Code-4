      <text x="172" y="242" text-anchor="middle" fill="#B7C3D6" font-size="13">JavaScript · HTML · CSS</text>
      <text x="172" y="264" text-anchor="middle" fill="#B7C3D6" font-size="13">Tailwind · PHP</text>
    </g>
    <g>
