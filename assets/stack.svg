<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="stackTitle stackDesc">
  <title id="stackTitle">Compétences</title>
  <desc id="stackDesc">Front-end, mobile, intelligence artificielle, back-end et outils.</desc>
  <defs>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="plateEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3EE0B0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7CC4FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F0C14D" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="28" fill="#070B12"/>
  <rect x="1" y="1" width="1198" height="338" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
  <rect x="80" y="58" width="1040" height="2" fill="url(#plateEdge)"/>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
