      <text x="457" y="168" text-anchor="middle" fill="#F4F7FB" font-size="20" font-weight="700">Intelligence</text>
      <text x="457" y="192" text-anchor="middle" fill="#F4F7FB" font-size="20" font-weight="700">artificielle</text>
      <text x="457" y="230" text-anchor="middle" fill="#B7C3D6" font-size="13">LLMs · RAG · Agents</text>
      <text x="457" y="252" text-anchor="middle" fill="#B7C3D6" font-size="13">n8n · Prompts</text>
    </g>
    <g>
