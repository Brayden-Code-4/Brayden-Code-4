    <circle cx="1040" cy="36" r="80" fill="#3EE0B0" fill-opacity="0.5">
      <animate attributeName="cy" values="36;58;36" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1160" cy="390" r="60" fill="#F0C14D" fill-opacity="0.28"/>
  </g>

  <g fill="none" stroke="#E8EEF8" stroke-opacity="0.45" stroke-width="1.25" stroke-linecap="square">
