<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Joseph NABOUDJA</title>
  <desc id="bannerDesc">Bannière de profil. Joseph NABOUDJA, développeur front-end et mobile à Lomé.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3EE0B0"/>
      <stop offset="0.52" stop-color="#7CC4FF"/>
      <stop offset="1" stop-color="#F0C14D"/>
    </linearGradient>
    <linearGradient id="fadeDots" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.16"/>
    </pattern>
    <mask id="dotMask">
      <rect width="1200" height="420" fill="url(#fadeDots)"/>
    </mask>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="#070B12"/>
  <rect width="1200" height="420" fill="url(#dots)" mask="url(#dotMask)"/>
  <rect width="1200" height="3" fill="url(#edge)"/>

  <g filter="url(#glow)">
